events {}

http {
    server {
        listen 80;
        server_name localhost;

        # Root location to serve the static frontend files
        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ /index.html; # This is important for single-page apps, good practice to keep
        }

        # API reverse proxy
        # Forward any requests to /api/... to the backend server
        location /api/ {
            proxy_pass http://127.0.0.1:8000/; # Note the trailing slash
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # The backend API prefix will be `/api`, but the backend itself doesn't know about it.
            # We need to rewrite the path to remove the `/api` prefix before forwarding.
            # Example: /api/accounts -> /accounts
            rewrite /api/(.*) /$1 break;
        }
    }
}
